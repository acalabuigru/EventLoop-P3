<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EmpleoPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/estilos.css">
    <style>
        /* Estilos específicos para el Drag & Drop */
        .drop-zone {
            min-height: 400px;
            border: 2px dashed #0d6efd;
            border-radius: 15px;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }
        .card-empleo {
            cursor: grab;
            margin-bottom: 10px;
        }
        .card-empleo:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">EmpleoPro</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="empleos.html">Ofertas y Demandas</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
                </ul>
                <span class="navbar-text text-info" id="usuarioActivo">-no login-</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="text-center mb-5">
            <h1>Dashboard de Empleo</h1>
            <p class="text-muted">Gestiona tus intereses arrastrando las ofertas a tu panel personal</p>
        </header>

        <div class="row">
            <div class="col-md-6">
                <div class="p-3 bg-white shadow-sm rounded">
                    <h4 class="mb-3">Ofertas y Demandas Disponibles</h4>
                    <hr>
                    <div id="tarjetas">
                        <p class="text-center text-muted py-5">Cargando empleos...</p>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3 bg-white shadow-sm rounded">
                    <h4 class="mb-3">Mi Selección Personal</h4>
                    <hr>
                    <div id="seleccionados" class="drop-zone d-flex flex-column p-3">
                        <p class="text-center text-muted my-auto">Arrastra aquí las ofertas que te interesen</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../JS/int_1_dashboard.js"></script>
</body>
</html>
