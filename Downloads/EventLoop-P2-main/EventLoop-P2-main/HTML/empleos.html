<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ofertas y Demandas - EmpleoPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">EmpleoPro</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="nav-link active" href="empleos.html">Ofertas y Demandas</a>
                <a class="nav-link" href="usuarios.html">Usuarios</a>
            </div>
            <span class="navbar-text text-info" id="usuarioActivo">-no login-</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm p-3 mb-4">
                    <h4>Nueva Oferta/Demanda</h4>
                    <form id="formEmpleo">
                        <input type="text" id="titulo" class="form-control mb-2" placeholder="Título" required>
                        <input type="email" id="emailEmpleo" class="form-control mb-2" placeholder="Email de contacto" required>
                        <input type="date" id="fecha" class="form-control mb-2" required>
                        <textarea id="descripcion" class="form-control mb-2" placeholder="Descripción" required></textarea>
                        <select id="tipo" class="form-select mb-2">
                            <option value="Oferta">Oferta</option>
                            <option value="Demanda">Demanda</option>
                        </select>
                        <button type="submit" class="btn btn-primary w-100">Publicar</button>
                    </form>
                </div>
                
                <div class="card shadow-sm p-3">
                    <h4>Estadísticas</h4>
                    <canvas id="graficoEmpleos" width="300" height="200" style="border:1px solid #ddd;"></canvas>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm p-3">
                    <h4>Listado</h4>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Tipo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEmpleos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../JS/int_3_empleos.js"></script>
</body>
</html>
